<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>LUCKY QQ99 - Tests</title>
<style>body{font-family:system-ui;margin:20px}td,th{border:1px solid #ccc;padding:3px 8px;font-size:13px}.ok{color:#047857}.bad{color:#b91c1c;font-weight:bold}</style></head>
<body>
<h2>LUCKY QQ99 - Kiểm Thử Trực Tiếp (Mở trực tiếp trên trình duyệt)</h2>
<div id="summary">Đang chạy...</div><pre id="log"></pre><table id="t"></table>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/stations.js"></script>
<script src="../assets/js/calculator.js"></script>
<script src="../assets/js/results.js"></script>
<script src="../assets/js/googleSheet.js"></script>
<script src="../assets/js/autoCheck.js"></script>
<script>
let pass = 0, fail = 0;
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  ok ? pass++ : fail++;
  log((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : `  got=${JSON.stringify(got)} want=${JSON.stringify(want)}`));
}
(async () => {
  try {
    // --- Stations ---
    eq('forDay Nam T7', Stations.forDay('Nam', '14/11/2026'), ['TPHCM', 'Long An', 'Bình Phước', 'Hậu Giang']);
    eq('forDay Trung T2', Stations.forDay('Trung', '09/11/2026'), ['Phú Yên', 'Huế']);
    eq('parseDai alias', Stations.parseDai('HCM, LA, hg', 'Nam', '14/11/2026'), ['TPHCM', 'Long An', 'Hậu Giang']);
    eq('parseDai count legacy', Stations.parseDai('3', 'Nam', '14/11/2026'), ['TPHCM', 'Long An', 'Bình Phước']);
    eq('parseDai Bắc', Stations.parseDai('1', 'Bắc', '14/11/2026'), ['Miền Bắc']);

    // --- Digit Length & Parsing ---
    eq('digitLength Bao Lô 2 số', Calculator.getDigitLength('Bao Lô 2 số'), 2);
    eq('digitLength Bao Lô 3 số', Calculator.getDigitLength('Bao Lô 3 số'), 3);
    eq('digitLength Bao Lô 4 số', Calculator.getDigitLength('Bao Lô 4 số'), 4);
    eq('digitLength Đầu Đuôi', Calculator.getDigitLength('Đầu Đuôi'), 2);
    eq('digitLength Xỉu Chủ Đầu', Calculator.getDigitLength('Xỉu Chủ Đầu'), 3);
    eq('inferLoaiCuoc 406', Calculator.inferLoaiCuoc('406'), 'Bao Lô 3 số');
    eq('inferLoaiCuoc 123 456', Calculator.inferLoaiCuoc('123 456'), 'Bao Lô 3 số');
    eq('inferLoaiCuoc 1234', Calculator.inferLoaiCuoc('1234'), 'Bao Lô 4 số');
    eq('inferLoaiCuoc 08 80', Calculator.inferLoaiCuoc('08 80'), 'Bao Lô 2 số');
    eq('enrichTicket tự phục hồi 406', Calculator.enrichTicket({ player: 'X', so: '406', tien: 5000, mien: 'Nam', dai: 'Đồng Nai' }).loaiCuoc, 'Bao Lô 3 số');
    eq('enrichTicket giữ nguyên 406 không bị cắt thành 06', Calculator.enrichTicket({ player: 'X', so: '406', tien: 5000, mien: 'Nam', dai: 'Đồng Nai' }).so, '406');
    eq('parseNumbers 2 digits', Calculator.parseNumbers('8 80 9', 2), ['08', '80', '09']);
    eq('parseNumbers 3 digits', Calculator.parseNumbers('123 456 7', 3), ['123', '456', '007']);
    eq('parseNumbers 4 digits', Calculator.parseNumbers('1234 5678', 4), ['1234', '5678']);

    // --- Công thức tiền (khớp ví dụ trong luật) ---
    const e1 = Calculator.enrichTicket({ date: '14/11/2026', player: 'A', mien: 'Nam', dai: 'TPHCM, Long An, Bình Phước', loaiCuoc: 'Bao Lô 2 số', so: '08 80 09 90', tien: 5000, trung: '' });
    eq('MN 5k 3đài 4con thuKhach', e1.thuKhach, 840000);
    eq('MN 5k 3đài 4con nguonThu', e1.nguonThu, 820000);

    const e2 = Calculator.enrichTicket({ date: '14/11/2026', player: 'A', mien: 'Bắc', dai: 'Miền Bắc', loaiCuoc: 'Bao Lô 2 số', so: '03 30 11 66', tien: 5000, trung: '03 66x2' });
    eq('MB 5k 4con thuKhach', e2.thuKhach, 420000);
    eq('MB 5k 4con nguonThu (làm tròn tổng 410.400)', e2.nguonThu, 410000);
    eq('MB nháy từ Trúng', e2.trungNLo, 3);
    eq('MB qLoi', e2.qLoi, (420000 - 410000) + 3 * 5000 * 2);

    // Cược mới: Bao Lô 3 số, 4 số, Đầu Đuôi, Xỉu Chủ
    const e3 = Calculator.enrichTicket({ date: '14/11/2026', player: 'B', mien: 'Nam', dai: 'TPHCM', loaiCuoc: 'Bao Lô 3 số', so: '918 454', tien: 1000, trung: '918' });
    eq('MN 3 càng 1k 1đài 2con thuKhach', e3.thuKhach, 28000);
    eq('MN 3 càng 1k 1đài 2con nguonThu', e3.nguonThu, Math.floor((1000 * 17 * 76 * 1 * 2) / 100 / 1000) * 1000);
    eq('MN 3 càng trúng 1 con', e3.trungNLo, 1);
    eq('MN 3 càng khachTrung', e3.khachTrung, 620000);

    const e4 = Calculator.enrichTicket({ date: '14/11/2026', player: 'C', mien: 'Nam', dai: 'TPHCM', loaiCuoc: 'Bao Lô 4 số', so: '4426', tien: 1000, trung: '4426' });
    eq('MN 4 càng 1k 1đài 1con thuKhach', e4.thuKhach, 14000);
    eq('MN 4 càng khachTrung', e4.khachTrung, 5000000);

    const e5 = Calculator.enrichTicket({ date: '14/11/2026', player: 'D', mien: 'Nam', dai: 'TPHCM', loaiCuoc: 'Đầu Đuôi', so: '96', tien: 10000, trung: '96' });
    eq('MN Đầu Đuôi 10k thuKhach', e5.thuKhach, 16000);
    eq('MN Đầu Đuôi 10k khachTrung', e5.khachTrung, 720000);

    const e6 = Calculator.enrichTicket({ date: '14/11/2026', player: 'E', mien: 'Bắc', dai: 'Miền Bắc', loaiCuoc: 'Đầu Đuôi', so: '96', tien: 10000, trung: '96' });
    eq('MB Đầu Đuôi 10k thuKhach', e6.thuKhach, 40000);

    const e7 = Calculator.enrichTicket({ date: '14/11/2026', player: 'F', mien: 'Bắc', dai: 'Miền Bắc', loaiCuoc: 'Xỉu Chủ Đầu Đuôi', so: '918', tien: 10000, trung: '918' });
    eq('MB Xỉu Chủ 10k thuKhach', e7.thuKhach, 32000);

    // --- Parser trên kết quả thật 14/11/2026 ---
    const kq = {};
    for (const m of ['Nam', 'Trung', 'Bắc']) {
      kq[m] = await Results.get(m, '14/11/2026', { force: true });
      log(`${m}: ` + kq[m].stations.map(s => `${s.name}[tails2=${s.tails2.length}, tails3=${s.tails3.length}, tails4=${s.tails4.length}]`).join(', '));
      eq(`${m} tất cả đài đủ giải`, kq[m].stations.every(s => s.complete), true);
    }
    eq('MN T7 có 4 đài', kq.Nam.stations.map(s => s.name), ['TPHCM', 'Long An', 'Bình Phước', 'Hậu Giang']);
    eq('MB 1 đài 27 lô', kq['Bắc'].stations[0].tails2.length, 27);
    eq('MN TPHCM G8 = 96', kq.Nam.stations[0].tails2[0], '96');
    eq('MN TPHCM G7 = 918', kq.Nam.stations[0].tails3[0], '918');
    eq('MN TPHCM G6.1 = 4426', kq.Nam.stations[0].tails4[0], '4426');
    eq('MN TPHCM dauDuoi', kq.Nam.stations[0].dauDuoi, ['96', '49']);
    eq('MN TPHCM xiuChuDau', kq.Nam.stations[0].xiuChuDau, ['918']);
    eq('MN TPHCM xiuChuDuoi', kq.Nam.stations[0].xiuChuDuoi, ['949']);

    // Dò vé các loại cược với kết quả thật 14/11/2026
    const tBaoLo3 = { date: '14/11/2026', player: 'Test', mien: 'Nam', daiList: ['TPHCM'], loaiCuoc: 'Bao Lô 3 số', so: '918 999' };
    const rBaoLo3 = Results.settle(tBaoLo3, kq.Nam);
    eq('Dò Bao Lô 3 số trúng 918', rBaoLo3.hits, { '918': 1 });

    const tDauDuoi = { date: '14/11/2026', player: 'Test', mien: 'Nam', daiList: ['TPHCM'], loaiCuoc: 'Đầu Đuôi', so: '96 49' };
    const rDauDuoi = Results.settle(tDauDuoi, kq.Nam);
    eq('Dò Đầu Đuôi trúng cả đầu và đuôi', rDauDuoi.hits, { '96': 1, '49': 1 });

    const tXC = { date: '14/11/2026', player: 'Test', mien: 'Nam', daiList: ['TPHCM'], loaiCuoc: 'Xỉu Chủ Đầu Đuôi', so: '918 949' };
    const rXC = Results.settle(tXC, kq.Nam);
    eq('Dò Xỉu Chủ Đầu Đuôi trúng cả 2', rXC.hits, { '918': 1, '949': 1 });

    // --- Đối chiếu dữ liệu thật: dò lại các dòng cũ và so với cột "Trúng N Lô" cũ ---
    const recs = await GoogleSheet.fetchSheetData();
    log(`Sheet mode=${GoogleSheet.mode}, ${recs.length} dòng`);
    const rows = [];
    for (const r of recs) {
      const t = Calculator.enrichTicket(r);
      let res = { ready: false, reason: '?' };
      try { res = Results.settle(t, await Results.get(t.mien, t.date)); } catch (e) { res = { ready: false, reason: e.message }; }
      const trung = res.ready ? Results.hitsToTrung(res.hits) : '(' + res.reason + ')';
      const hits = res.ready ? Calculator.hitsFromTrung(trung, Calculator.parseNumbers(t.so, Calculator.getDigitLength(t.loaiCuoc))) : null;
      rows.push({ date: t.date, player: t.player, mien: t.mien, dai: t.dai, loaiCuoc: t.loaiCuoc, so: t.so, tien: t.tien, trung, hits, legacy: t.legacyHits });
    }
    document.getElementById('t').innerHTML = '<tr><th>Ngày</th><th>Khách</th><th>Miền</th><th>Đài</th><th>Loại Cược</th><th>Số</th><th>Tiền</th><th>Trúng (dò mới)</th><th>Nháy mới</th><th>Nháy cũ (Sheet)</th><th></th></tr>' +
      rows.map(r => `<tr><td>${r.date}</td><td>${r.player}</td><td>${r.mien}</td><td>${r.dai}</td><td><span style="background:#fef3c7;padding:2px 6px;border-radius:4px;font-weight:bold">${r.loaiCuoc}</span></td><td>${r.so}</td><td>${r.tien}</td><td>${r.trung}</td><td>${r.hits}</td><td>${r.legacy}</td><td class="${r.hits === r.legacy ? 'ok' : 'bad'}">${r.hits === r.legacy ? 'KHỚP' : 'LỆCH'}</td></tr>`).join('');
  } catch (e) {
    fail++; log('LỖI: ' + e.message + '\n' + e.stack);
  }
  document.getElementById('summary').innerHTML = `<b class="${fail ? 'bad' : 'ok'}">PASS ${pass} / FAIL ${fail}</b>`;
  document.title = `DONE pass=${pass} fail=${fail}`;
})();
</script></body></html>
